<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { width: 340px; margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f8f6ff; }
      header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; background: #fff; border-bottom: 1px solid #ece8fb; }
      header img { width: 26px; height: 26px; }
      header b { font-size: 15px; }
      main { padding: 14px 16px; display: grid; gap: 12px; }
      label { display: grid; gap: 4px; font-weight: 600; font-size: 12px; color: #334155; }
      input[type=text], input[type=password] { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; background: #fff; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; }
      .row small { display: block; font-weight: 400; color: #64748b; }
      .card { background: #fff; border: 1px solid #ece8fb; border-radius: 14px; padding: 12px; }
      .status { font-size: 12px; color: #475569; }
      .status.ok { color: #047857; } .status.err { color: #b91c1c; }
      button { border: 0; border-radius: 999px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
      .primary { background: #6c3ee8; color: #fff; } .primary:disabled { opacity: .6; }
      .ghost { background: #fff; border: 1px solid #cbd5e1; }
      .actions { display: flex; gap: 8px; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 180px; overflow: auto; }
      li { font-size: 12px; }
      li b { display: block; }
      .pill { display: inline-block; border-radius: 999px; padding: 0 6px; font-size: 11px; font-weight: 600; }
      .submitted { background: #d1fae5; color: #065f46; } .needs_you { background: #fef3c7; color: #92400e; } .failed { background: #fee2e2; color: #991b1b; }
      .muted { color: #64748b; font-size: 11px; }
    </style>
  </head>
  <body>
    <header><img src="icons/icon48.png" alt="" /><b>Jobify Autopilot</b></header>
    <main>
      <label>Jobify address<input id="baseUrl" type="text" placeholder="https://your-app.vercel.app" /></label>
      <label>Extension key<input id="token" type="password" placeholder="jbx_… from Settings → Autopilot" /></label>
      <div class="actions"><button id="save" class="ghost">Save</button><span id="status" class="status"></span></div>

      <div class="card">
        <div class="row"><span>Auto-submit<small>Checks for ready applications every 5 min</small></span><input id="enabled" type="checkbox" /></div>
        <div class="row" style="margin-top:10px"><span>Test mode<small>Fill forms but don't click Submit</small></span><input id="testMode" type="checkbox" /></div>
      </div>

      <div class="actions"><button id="run" class="primary">Run now</button><span id="runMsg" class="status"></span></div>

      <div>
        <div class="row" style="margin-bottom:6px"><span>Recent activity</span></div>
        <ul id="history"><li class="muted">Nothing yet.</li></ul>
      </div>
      <p class="muted">Keep Chrome open for Junu to apply. Forms with a CAPTCHA, or questions Junu can't answer, are left open in a tab for you.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
